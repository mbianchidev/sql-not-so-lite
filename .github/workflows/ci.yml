name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Go worker budget
        run: bash scripts/ci-go-budget.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -p "$CI_WORKERS" -parallel "$GOMAXPROCS" -timeout 60s -v

      - name: Build binary
        run: go build -p "$CI_WORKERS" -ldflags="-s -w" -o sqnsl ./cmd/sqnsl/

  web:
    name: Web lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test release automation and formula generation
        working-directory: ${{ github.workspace }}
        run: node --test scripts/release.test.mjs scripts/homebrew.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-gui-${{ github.sha }}
          path: internal/server/static
          if-no-files-found: error
          retention-days: 3

  packages:
    name: Release packaging
    needs: [go, web]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Go worker budget
        run: bash scripts/ci-go-budget.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .goreleaser.yaml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-gui-${{ github.sha }}
          path: ${{ runner.temp }}/sqnsl-gui-${{ github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean --parallelism=${{ env.CI_WORKERS }}
        env:
          SQNSL_GUI_ARTIFACT_DIR: ${{ runner.temp }}/sqnsl-gui-${{ github.sha }}

      - name: Verify archives, checksums, embedded GUI, and container
        run: node scripts/verify-release.mjs dist --docker

      - name: Install and remove Debian and RPM packages
        run: bash scripts/test-packages.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-snapshot-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/metadata.json
            dist/sql-not-so-lite.rb

  native-packages:
    name: Native release (${{ matrix.runner }})
    needs: packages
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        runner: [ubuntu-24.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-snapshot-${{ github.sha }}
          path: dist

      - name: Verify native CLI, API, embedded GUI, and checksums
        run: node scripts/verify-release.mjs dist

      - name: Install and remove ARM64 Debian and RPM packages
        if: runner.os == 'Linux'
        run: bash scripts/test-packages.sh dist

      - name: Resolve Homebrew bundle cache
        if: runner.os == 'macOS'
        id: homebrew-cache
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_DEVELOPER: "1"
        run: |
          repository=$(brew --repository)
          key=$(brew ruby -rdigest -e \
            'print RUBY_VERSION, "-", RUBY_PLATFORM, "-", Digest::SHA256.file(File.join(ARGV.fetch(0), "Library/Homebrew/Gemfile.lock")).hexdigest' \
            "$repository")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "path=$repository/Library/Homebrew/vendor/bundle" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'macOS'
        with:
          path: ${{ steps.homebrew-cache.outputs.path }}
          key: homebrew-${{ matrix.runner }}-${{ runner.arch }}-${{ steps.homebrew-cache.outputs.key }}

      - name: Install and test Homebrew formula against snapshot archives
        if: runner.os == 'macOS'
        run: bash scripts/test-homebrew.sh dist

  result:
    name: CI result
    if: ${{ always() }}
    needs: [go, web, packages, native-packages]
    runs-on: ubuntu-latest
    env:
      JOBS: ${{ toJSON(needs) }}
      FULL_VALIDATION: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - name: Require the checks selected by the PR policy
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.JOBS)
          const full = process.env.FULL_VALIDATION
          if (!['true', 'false'].includes(full)) throw new Error('Invalid CI validation mode')
          const packaging = full === 'true' ? 'success' : 'skipped'
          const expected = {go: 'success', web: 'success', packages: packaging, 'native-packages': packaging}
          for (const [name, result] of Object.entries(expected)) {
            if (jobs[name]?.result !== result) {
              throw new Error(`${name}: expected ${result}, got ${jobs[name]?.result}`)
            }
          }
          console.log(full === 'true' ? 'All platform and package checks passed.' :
            'Draft Go/web checks passed. Full distribution checks run when ready for review.')
          NODE
